[package]
name = "dotfiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Compose a machine from layers"
license = "MIT"

[[bin]]
name = "dotfiles"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "5"
owo-colors = { version = "4", features = ["supports-colors"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
