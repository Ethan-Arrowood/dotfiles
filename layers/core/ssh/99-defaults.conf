# Fallback defaults. ssh takes the FIRST value it sees for a keyword, and the
# Include for this directory sits at the top of ~/.ssh/config, so a `Host *`
# block here would beat every Host block below it. `Match final` blocks are
# read only in a last pass, after all other values are set, so these fill in
# only what nothing else set.

Match final
	IgnoreUnknown UseKeychain
	AddKeysToAgent yes
	UseKeychain yes
	ServerAliveInterval 60
	ServerAliveCountMax 3
