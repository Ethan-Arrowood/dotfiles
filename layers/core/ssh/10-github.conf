# Put machine-specific hosts in ~/.ssh/config.d/ or ~/.ssh/config.

# Linux ssh has no UseKeychain. IgnoreUnknown applies only once read in an
# active block, and ssh rejects unknown options even in blocks that don't
# match, so it must sit here, before any Host block.
IgnoreUnknown UseKeychain

Host github.com
	User git
	AddKeysToAgent yes
	UseKeychain yes
	# If DOTFILES_SSH_KEY changes, add a matching IdentityFile in ~/.ssh/config.d/.
	# SSH cannot read that variable.
	IdentityFile ~/.ssh/id_ed25519
	# Trust GitHub's published host keys (see that file for their source).
	# ssh adds new keys to the first file, so keep yours first: it must not
	# write to the linked file in this repo.
	UserKnownHostsFile ~/.ssh/known_hosts ~/.ssh/known_hosts.d/github.known_hosts
