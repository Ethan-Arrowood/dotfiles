# Managed by the dotfiles core layer. Machine-specific hosts belong in
# ~/.ssh/config.d/ alongside this file, or in ~/.ssh/config itself.
#
# IgnoreUnknown keeps UseKeychain from breaking ssh on Linux, where the option
# does not exist — without it, ssh refuses to parse the file at all.

Host github.com
	IgnoreUnknown UseKeychain
	User git
	AddKeysToAgent yes
	UseKeychain yes
	# Matches the default in signing.rs. If you point DOTFILES_SSH_KEY somewhere
	# else, add a matching IdentityFile in ~/.ssh/config.d/ -- ssh has no way to
	# read that variable.
	IdentityFile ~/.ssh/id_ed25519
